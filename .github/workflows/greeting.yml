name: greeting

on:
  pull_request:

jobs:
  greeting:
    name: greeting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The greeting is signed
        run: |
          if ! grep -qx 'Hello from the maestro\.' README.md; then
            echo "::error file=README.md::The section needs a line that reads exactly: Hello from the maestro."
            exit 1
          fi
          if ! grep -qx '— maestro' README.md; then
            echo "::error file=README.md::Sign the greeting on its own line, after it: — maestro"
            exit 1
          fi
